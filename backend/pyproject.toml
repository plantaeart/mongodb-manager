[project]
name = "mongodb-manager-app"
version = "1.2.5"
description = "CLI tool for MongoDB backup/restore management using mongodump/mongorestore"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "MongoDB Manager", email = "admin@example.com" }
]
keywords = ["mongodb", "backup", "restore", "cli", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "pymongo>=4.6.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.0",
    "tzdata>=2024.1",
    # FastAPI dependencies
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.0.0",
    # Docker API for container discovery
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mongodb-manager = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
