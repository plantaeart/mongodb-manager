name: mongodb-manager-dev

services:
  # Internal MongoDB for app session storage
  manager-mongodb:
    image: mongo:7.0
    container_name: manager-mongodb-dev
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MANAGER_DB_USERNAME:-manager_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MANAGER_DB_PASSWORD:-changeme123}
      - TZ=Europe/Paris
    volumes:
      - manager-mongodb-data-dev:/data/db
    networks:
      - mongodb-manager-network-dev
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API (Development Mode with Hot Reload)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: mongodb-manager-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      manager-mongodb:
        condition: service_healthy
    volumes:
      # Mount source code for hot reload
      - ../backend:/app
      # Backup storage
      - mongodb-backups-dev:/backups_mongodb_manager
      # Config persistence (connections.json)
      - mongodb-manager-data-dev:/data/.mongodb-manager
      # Exclude virtual environment and cache from mount
      - /app/.venv
      - /app/__pycache__
      - /app/.pytest_cache
    networks:
      - mongodb-manager-network-dev
    environment:
      - TZ=Europe/Paris
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
      # Internal MongoDB connection (for sessions and users)
      - MANAGER_DB_URI=mongodb://${MANAGER_DB_USERNAME:-manager_admin}:${MANAGER_DB_PASSWORD:-changeme123}@manager-mongodb:27017/manager_app?authSource=admin
      # JWT Secret
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      # Default admin password (first time only)
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
      # CORS Origins (allow frontend access)
      - CORS_ORIGINS=${CORS_ORIGINS}
    command: uvicorn app.main_api:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web UI (Development Mode with Hot Reload)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: mongodb-manager-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      - backend
    volumes:
      # Mount source code for hot reload
      - ../frontend:/app
      # Exclude node_modules from mount (use container's version)
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    networks:
      - mongodb-manager-network-dev
    environment:
      - TZ=Europe/Paris
      - NODE_ENV=development
      - PORT=${FRONTEND_PORT:-3000}
      - NUXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-8000}
      - NUXT_PUBLIC_WS_URL=ws://localhost:${BACKEND_PORT:-8000}
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${FRONTEND_PORT:-3000}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mongodb-backups-dev:
    driver: local
  mongodb-manager-data-dev:
    driver: local
  manager-mongodb-data-dev:
    driver: local

networks:
  mongodb-manager-network-dev:
    driver: bridge
