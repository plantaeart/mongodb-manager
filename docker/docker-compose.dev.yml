name: mongodb-manager-dev

services:
  # Internal MongoDB for app session storage
  manager-mongodb:
    image: mongo:7.0
    container_name: manager-mongodb-dev
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${NUXT_MONGODB_USERNAME:-mongodb_manager_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${NUXT_MONGODB_PASSWORD:-changeme123}
      - TZ=Europe/Paris
    volumes:
      - manager-mongodb-data-dev:/data/db
    networks:
      - mongodb-manager-network-dev
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API (Development Mode with Hot Reload)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: mongodb-manager-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      manager-mongodb:
        condition: service_healthy
    volumes:
      # Mount source code for hot reload
      - ../backend:/app
      # Backup storage
      - mongodb-backups-dev:/backups_mongodb_manager
      # Docker socket (read-only) for container name discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Exclude virtual environment and cache from mount
      - /app/.venv
      - /app/__pycache__
      - /app/.pytest_cache
    networks:
      - mongodb-manager-network-dev
    environment:
      - TZ=Europe/Paris
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
      - NODE_ENV=${NODE_ENV:-development}
      - BACKUP_BASE_DIR=/backups_mongodb_manager
      # MongoDB connection components (auto-generated URI in backend)
      - NUXT_MONGODB_USERNAME=${NUXT_MONGODB_USERNAME:-mongodb_manager_admin}
      - NUXT_MONGODB_PASSWORD=${NUXT_MONGODB_PASSWORD:-changeme123}
      - NUXT_MONGODB_HOST=${NUXT_MONGODB_HOST:-manager-mongodb}
      - NUXT_MONGODB_PORT=${NUXT_MONGODB_PORT:-27017}
      - NUXT_MONGODB_DATABASE=${NUXT_MONGODB_DATABASE:-manager_app}
      # Application authentication
      - NUXT_JWT_SECRET=${NUXT_JWT_SECRET:-dev-secret-change-in-production}
      - NUXT_ADMIN_PASSWORD=${NUXT_ADMIN_PASSWORD:-admin123}
      # CORS Origins (allow frontend access)
      - CORS_ORIGINS=${CORS_ORIGINS}
    command: uvicorn app.main_api:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      # ponytail: python one-liner, the dev image has no curl/wget
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web UI (Development Mode with Hot Reload)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: mongodb-manager-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      - backend
    volumes:
      # Mount source code for hot reload
      - ../frontend:/app
      # Exclude node_modules from mount (use container's version)
      - /app/node_modules
      - /app/.nuxt
      - /app/.output
    networks:
      - mongodb-manager-network-dev
    environment:
      - TZ=Europe/Paris
      - NODE_ENV=development
      - PORT=${FRONTEND_PORT:-3000}
      - NUXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-8000}
      - NUXT_PUBLIC_WS_URL=ws://localhost:${BACKEND_PORT:-8000}
    command: npm run dev
    healthcheck:
      # ponytail: 127.0.0.1, the dev server binds IPv4 only and localhost resolves to ::1
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${FRONTEND_PORT:-3000}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mongodb-backups-dev:
    driver: local
  manager-mongodb-data-dev:
    driver: local

networks:
  mongodb-manager-network-dev:
    driver: bridge
