name: mongodb-manager-prod

services:
  # Internal MongoDB for app session storage
  manager-mongodb:
    image: mongo:7.0
    container_name: manager-mongodb-prod
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MANAGER_DB_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MANAGER_DB_PASSWORD}
      - TZ=${TZ:-UTC}
    volumes:
      - manager-mongodb-data-prod:/data/db
    networks:
      - mongodb-manager-network-prod
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API (Production - Optimized)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: mongodb-manager-prod-backend:latest
    container_name: mongodb-manager-backend-prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      manager-mongodb:
        condition: service_healthy
    volumes:
      # Backup storage (production data)
      - mongodb-backups-prod:/backups_mongodb_manager
      # Config persistence (connections.json)
      - mongodb-manager-data-prod:/data/.mongodb-manager
    networks:
      - mongodb-manager-network-prod
    environment:
      - TZ=${TZ:-UTC}
      - PYTHONUNBUFFERED=1
      - NODE_ENV=${NODE_ENV:-production}
      # Internal MongoDB connection (for sessions and users)
      - MANAGER_DB_URI=mongodb://${MANAGER_DB_USERNAME}:${MANAGER_DB_PASSWORD}@manager-mongodb:27017/manager_app?authSource=admin
      # JWT Secret (MUST be set in production!)
      - JWT_SECRET=${JWT_SECRET}
      # Default admin password (first time only)
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      # CORS Origins (allow frontend access)
      - CORS_ORIGINS=${CORS_ORIGINS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security: Run with limited resources
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Frontend Web UI (Production - Optimized)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: mongodb-manager-prod-frontend:latest
    container_name: mongodb-manager-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mongodb-manager-network-prod
    environment:
      - TZ=${TZ:-UTC}
      - NODE_ENV=production
      - PORT=${FRONTEND_PORT:-3000}
      - NUXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-8000}
      - NUXT_PUBLIC_WS_URL=ws://localhost:${BACKEND_PORT:-8000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${FRONTEND_PORT:-3000}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security: Run with limited resources
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  mongodb-backups-prod:
    driver: local
  mongodb-manager-data-prod:
    driver: local
  manager-mongodb-data-prod:
    driver: local

networks:
  mongodb-manager-network-prod:
    driver: bridge
