name: mongodb-manager-prod

services:
  # Internal MongoDB for app session storage
  manager-mongodb:
    image: mongo:7.0
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${NUXT_MONGODB_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${NUXT_MONGODB_PASSWORD}
      - TZ=${TZ:-UTC}
    volumes:
      - manager-mongodb-data-prod:/data/db
    networks:
      - mongodb-manager-network-prod
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API (Production - Optimized)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mongodb-manager-prod-backend:latest
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      manager-mongodb:
        condition: service_healthy
    volumes:
      # Backup storage (production data)
      - mongodb-backups-prod:/backups_mongodb_manager
      # Docker socket (read-only) for container name discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mongodb-manager-network-prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ:-UTC}
      - PYTHONUNBUFFERED=1
      - NODE_ENV=${NODE_ENV:-production}
      - BACKUP_BASE_DIR=/backups_mongodb_manager
      # MongoDB connection components (auto-generated URI in backend)
      - NUXT_MONGODB_USERNAME=${NUXT_MONGODB_USERNAME}
      - NUXT_MONGODB_PASSWORD=${NUXT_MONGODB_PASSWORD}
      - NUXT_MONGODB_HOST=${NUXT_MONGODB_HOST:-manager-mongodb}
      - NUXT_MONGODB_PORT=${NUXT_MONGODB_PORT:-27017}
      - NUXT_MONGODB_DATABASE=${NUXT_MONGODB_DATABASE:-manager_app}
      # Application authentication
      - NUXT_JWT_SECRET=${NUXT_JWT_SECRET}
      - NUXT_ADMIN_PASSWORD=${NUXT_ADMIN_PASSWORD}
      # CORS Origins (allow frontend access)
      - CORS_ORIGINS=${CORS_ORIGINS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security: Run with limited resources
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Frontend Web UI (Production - Optimized)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Passed as build ARGs so Nuxt bakes them into the client bundle
        - NUXT_PUBLIC_API_URL=${NUXT_PUBLIC_API_URL}
        - NUXT_PUBLIC_WS_URL=${NUXT_PUBLIC_WS_URL}
    image: mongodb-manager-prod-frontend:latest
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mongodb-manager-network-prod
    environment:
      - TZ=${TZ:-UTC}
      - NODE_ENV=production
      - PORT=${FRONTEND_PORT:-3000}
      # Note: NUXT_PUBLIC_* are baked into the bundle at build time via build.args above.
      # These runtime values are kept for reference but do not affect the built bundle.
      - NUXT_PUBLIC_API_URL=${NUXT_PUBLIC_API_URL}
      - NUXT_PUBLIC_WS_URL=${NUXT_PUBLIC_WS_URL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${FRONTEND_PORT:-3000}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security: Run with limited resources
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  mongodb-backups-prod:
    driver: local
  manager-mongodb-data-prod:
    driver: local

networks:
  mongodb-manager-network-prod:
    driver: bridge
